        /* カード全体の挙動 */

        .spot-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        
        /* --- ★画像スライドショーのカスタムCSS --- */
        .slideshow-container {
            height: 120px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slideshow-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            animation: crossFade 15s infinite;
        }

        /* 5枚ある場合の基本アニメーション */
        .slideshow-container img:nth-child(1) { animation-delay: 0s; }
        .slideshow-container img:nth-child(2) { animation-delay: 3s; }
        .slideshow-container img:nth-child(3) { animation-delay: 6s; }
        .slideshow-container img:nth-child(4) { animation-delay: 9s; }
        .slideshow-container img:nth-child(5) { animation-delay: 12s; }

        @keyframes crossFade {
            0%   { opacity: 0; }
            5%   { opacity: 1; }
            20%  { opacity: 1; }
            25%  { opacity: 0; }
            100% { opacity: 0; }
        }

        /* --- ★スポット用の固定画像コンテナ --- */
        .static-container {
            height: 120px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .static-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .genre-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

            font-weight: bold;
            font-size: 1.25rem;
            position: relative;
            z-index: 2;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-content { animation: fadeIn 0.3s ease-out forwards; }
        
        .comment-highlight { background-color: #e5e7eb; padding: 4px 6px; border-radius: 4px; line-height: 1.6; }
        
        /* タブデザイン */
        .tab-btn {
            font-weight: bold;
            padding: 8px 24px;
            border-bottom: 4px solid transparent;

        // --- ★ジャンル定義 ---
        const foodGenres = [
            { id: "udon", title: "俺はうどんをすするぞ！ズゾゾォォォーーッ！！" },
            { id: "ramen", title: "あァァァんまりだァァアァ！宮崎のラーメンが美味すぎて涙が出るゥゥゥ！" },
            { id: "teishoku", title: "あたしはこの空腹の海から解放される…！この定食で腹の虫をブチのめすッ！" },
            { id: "survival", title: "宮大生の奇妙な日常 〜若者のお腹は満たせない〜" },
            { id: "world", title: "『ミヤザキグルメ・ザ・ワールド）』ッ！" },
            { id: "dessert", title: "ディ・モールトディ・モールト良いぞッ!至福のゴールド・エクスペリエンス" },
            { id: "enkai", title: "いともたやすく行われるえげつない宴会" }
        ];

        const spotGenres = [
            { id: "shop", title: "宮崎県民は動かない。宮崎県民　カイモノへ行く。 "},
            { id: "play", title: "MIYAZAKI'S BIZARRE PLAYGROUND OVER HEAVEN" },
            { id: "sight", title: "恥知らずの観光名所" }
        ];

        let currentPage = 'food';

        function switchTab(page) {
            currentPage = page;
            const tabFood = document.getElementById('tab-food');
            const tabSpot = document.getElementById('tab-spot');
            
            if(page === 'food') {
                tabFood.classList.add('tab-active', 'text-white');
                tabFood.classList.remove('text-orange-200');
                tabSpot.classList.remove('tab-active', 'text-white');
                tabSpot.classList.add('text-orange-200');
            } else {
                tabSpot.classList.add('tab-active', 'text-white');
                tabSpot.classList.remove('text-orange-200');
                tabFood.classList.remove('tab-active', 'text-white');
                tabFood.classList.add('text-orange-200');
            }
            render();
        }

        function render() {
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = '';
            
            const currentGenres = currentPage === 'food' ? foodGenres : spotGenres;
            const currentData = currentPage === 'food' ? foodShops : spotShops;

            currentGenres.forEach(g => {
                const targetShops = currentData.filter(shop => shop.genre === g.id);
                if(targetShops.length === 0) return;

                const st = genreStyles[g.id];

                const section = document.createElement('section');
                section.className = "mb-16";
                section.innerHTML = `
                    <div class="flex items-center gap-3 mb-6">
                        <div class="w-3 h-8 ${st.bar} rounded"></div>
                        <h2 class="text-2xl font-bold text-gray-800">${g.title}</h2>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="grid-${g.id}"></div>
                `;
                mainContent.appendChild(section);

                const grid = document.getElementById(`grid-${g.id}`);
                targetShops.forEach(shop => {
                    const shopDataStr = JSON.stringify(shop).replace(/'/g, "\\'");
                    const areaStyle = getAreaStyle(shop.area);

                    const card = document.createElement('div');
                    card.className = "bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden spot-card flex flex-col";
                    card.setAttribute('onclick', `openModal('${shopDataStr}')`);
                    
                    let imageHtml = '';
                    if (currentPage === 'food') {
                        // 飲食編はスライドショー
                        // （※最低5枚のimgタグを出力しないとCSSアニメーションが崩れるため、不足分は外観画像で補填する）
                        const imgs = [];
                        for (let i = 0; i < 5; i++) {
                            imgs.push(shop.images[i] ? shop.images[i] : shop.exteriorImage);
                        }
                        imageHtml = `
                            <div class="slideshow-container">
                                <img src="${imgs[0]}">
                                <img src="${imgs[1]}">
                                <img src="${imgs[2]}">
                                <img src="${imgs[3]}">
                                <img src="${imgs[4]}">
                                
                            </div>
                        `;
                    } else {
                        // スポット編は外観1枚のみ
                        imageHtml = `
                            <div class="static-container">
                                <img src="${shop.exteriorImage}">
                                
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        ${imageHtml}
                        <div class="p-5 flex-grow flex flex-col">
                            <div class="mb-3">
                                <span class="${areaStyle} text-xs font-bold px-2 py-1 rounded border">${shop.area}</span>
                            </div>
                            <h3 class="text-xl font-bold mb-3">${shop.name}</h3>
                            <p class="text-sm text-gray-600 comment-highlight mb-4 flex-grow">「${shop.comment}」</p>
                            <div class="text-right mt-auto">
                                <span class="text-blue-500 font-bold text-sm">詳細を見る ＞</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });
        }

        function openModal(shopDataStr) {
            const shop = JSON.parse(shopDataStr);
            const st = genreStyles[shop.genre];
            
            document.getElementById('modal-title').innerText = shop.name;
            
            const areaBadge = document.getElementById('modal-area');
            areaBadge.innerText = shop.area;
            areaBadge.className = `${getAreaStyle(shop.area)} text-sm font-semibold px-3 py-1 rounded border`;
            
            document.getElementById('modal-exterior').src = shop.exteriorImage;
            document.getElementById('modal-comment').innerText = `「${shop.comment}」`;
            document.getElementById('modal-detail-comment').innerText = shop.detailComment;
            
            // ★ モーダル内の画像を動的に生成
            const imagesContainer = document.getElementById('modal-images-container');
            imagesContainer.innerHTML = ''; 
            if (shop.images && shop.images.length > 0) {
                shop.images.forEach(imgSrc => {
                    const imgTag = document.createElement('img');
                    imgTag.src = imgSrc;
                    imgTag.className = "w-72 aspect-[4/3] object-cover rounded-lg snap-start shrink-0 border border-gray-200 shadow-sm";
                    imagesContainer.appendChild(imgTag);
                });
            }

            const singleInfo = document.getElementById('single-location-info');
            const multiInfo = document.getElementById('multi-location-info');
            
            if (shop.locations && shop.locations.length > 0) {
                singleInfo.classList.add('hidden');
                multiInfo.classList.remove('hidden');
                
                let locationsHtml = '';
                shop.locations.forEach(loc => {
                    // ★ 複数店舗：正しいGoogleマップ検索URLを自動生成
                    const mapQuery = encodeURIComponent(loc.mapQuery || loc.name);
                    const mapUrl = `https://www.google.com/maps/search/?api=1&query=${mapQuery}`;
                    
                    locationsHtml += `
                        <div class="bg-white p-4 rounded border border-gray-200 shadow-sm">
                            <h4 class="font-bold text-lg mb-2 text-gray-800 border-l-4 ${st.bar.replace('bg-', 'border-l-')} pl-2">${loc.name}</h4>
                            <ul class="text-sm text-gray-700 space-y-1 mb-3">
                                <li><strong>🕒 営業時間:</strong> ${loc.hours}</li>
                                <li><strong>📅 定休日:</strong> ${loc.closed}</li>
                            </ul>
                            <a href="${mapUrl}" target="_blank" class="inline-block w-full text-center bg-blue-500 text-white py-2 rounded font-bold hover:bg-blue-600 transition text-sm">
                                MAPを開く
                            </a>
                        </div>
                    `;
                });
                multiInfo.innerHTML = locationsHtml;
                
            } else {
                singleInfo.classList.remove('hidden');
                multiInfo.classList.add('hidden');
                
                document.getElementById('modal-hours').innerText = shop.hours;
                document.getElementById('modal-closed').innerText = shop.closed;
                document.getElementById('modal-phone').innerText = shop.phone || "要確認";
                
                // ★ 単独店舗：正しいGoogleマップ検索URLを自動生成（店舗名＋エリアで検索）
                const mapQuery = encodeURIComponent(`${shop.name} ${shop.area}`);
                document.getElementById('modal-map-link').href = `https://www.google.com/maps/search/?api=1&query=${mapQuery}`;
            }
            
            document.getElementById('spot-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('spot-modal').classList.add('hidden');
        }

        document.getElementById('spot-modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // 初期表示を「飲食編」に設定
        switchTab('food');
    </script>
